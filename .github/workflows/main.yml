name: Build HC15 Profile Diagnostic APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Locate APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/HC15ProfileDiagnostic-V0.1.0-debug.apk release/HC15ProfileDiagnostic-V0.1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HC15ProfileDiagnostic-V0.1.0
          path: release/HC15ProfileDiagnostic-V0.1.0.apk
