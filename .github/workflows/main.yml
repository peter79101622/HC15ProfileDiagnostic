name: Build HC15 Profile Diagnostic APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Show Android SDK info
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --list_installed | grep -E "platforms;android-35|build-tools;35.0.0|platform-tools" || true

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          echo "Found APK: $APK"
          cp "$APK" release/HC15ProfileDiagnostic-V0.1.1.apk
          ls -lh release/HC15ProfileDiagnostic-V0.1.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HC15ProfileDiagnostic-V0.1.1
          path: release/HC15ProfileDiagnostic-V0.1.1.apk
          if-no-files-found: error
